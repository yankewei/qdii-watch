name: Scrape Fund Limits

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "scrape"
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run scraper
        id: scrape
        run: |
          npx tsx scraper.ts
          if node -e "const { changes } = require('./docs/data/changes.json'); process.exit(changes.length > 0 ? 0 : 1)"; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes to commit"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            git commit -m "Update fund limits data [$(date -u +'%Y-%m-%d %H:%M UTC')]"
            git push
          fi

      - name: Trigger notifications
        if: steps.scrape.outputs.has_changes == 'true'
        run: |
          if [ -f docs/data/changes.json ]; then
            curl -X POST "${{ vars.PAGES_URL }}/api/notify" \
              -H "Authorization: Bearer ${{ secrets.NOTIFY_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d @docs/data/changes.json
          fi
